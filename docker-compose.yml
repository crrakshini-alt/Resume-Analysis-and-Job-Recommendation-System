version: '3.8'

services:
  backend:
    build:
      context: ./Resume_analyser
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./Resume_analyser/database.db:/app/database.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-resume
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
